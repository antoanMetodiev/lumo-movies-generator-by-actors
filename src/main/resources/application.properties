spring.application.name=back-end

spring.datasource.url= ${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Without minimum-idle, HikariCP defaults it to maximum-pool-size, which keeps
# all 5 connections open permanently even when idle — on a Postgres tier this
# constrained, that alone (times every service sharing the instance) is enough
# to exhaust "remaining connection slots" before any real traffic burst hits.
# minimum-idle lets the pool shrink back down after idle-timeout of inactivity.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#JPA Properties
spring.jpa.properties.hibernate.format_sql = TRUE

#Virtual Threads
spring.threads.virtual.enabled=true

###Logging Levels
# Disable the default loggers
logging.level.org = WARN
logging.level.blog = WARN

#Show SQL executed with parameter bindings
logging.level.org.hibernate.SQL = DEBUG
logging.level.org.hibernate.type.descriptor = TRACE

management.endpoints.web.exposure.include=health
server.port=9999

# --- Metrics (RAM/CPU tracking on Render's free tier) ---
# Pushes JVM heap/non-heap/thread/CPU metrics to Grafana Cloud via OTLP every
# 60s. GRAFANA_OTLP_ENDPOINT/GRAFANA_OTLP_AUTH come from Grafana Cloud's
# "Connections > OpenTelemetry" page and are set as Render env vars — never
# committed here. Left unset, export.enabled defaults to false and this is a
# no-op (safe for local dev).
management.otlp.metrics.export.enabled=${GRAFANA_OTLP_ENABLED:false}
management.otlp.metrics.export.url=${GRAFANA_OTLP_ENDPOINT:}
management.otlp.metrics.export.headers.Authorization=${GRAFANA_OTLP_AUTH:}
management.otlp.metrics.export.step=60s
management.otlp.metrics.export.resource-attributes.service.name=lumo-movies-generator-by-actors